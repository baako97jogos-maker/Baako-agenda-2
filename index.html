<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090909">
  <title>BAAKO tattoo — Agenda</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #090909;
      color: #fff;
      min-height: 100vh;
    }

    header {
      padding: 25px 20px 18px;
      border-bottom: 1px solid #252525;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
      letter-spacing: 3px;
    }

    header h1 span {
      font-weight: 300;
    }

    header p {
      color: #888;
      margin-top: 6px;
      font-size: 13px;
      letter-spacing: 1px;
    }

    main {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .top h2 {
      font-size: 20px;
    }

    .add {
      background: #fff;
      color: #000;
      border: none;
      padding: 11px 16px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .card {
      background: #121212;
      border: 1px solid #292929;
      border-radius: 15px;
      padding: 17px;
      margin-bottom: 12px;
    }

    .date {
      color: #999;
      font-size: 12px;
      margin-bottom: 7px;
    }

    .client {
      font-size: 18px;
      font-weight: bold;
    }

    .details {
      color: #aaa;
      margin-top: 8px;
      font-size: 14px;
    }

    .empty {
      text-align: center;
      color: #666;
      padding: 50px 20px;
      border: 1px dashed #333;
      border-radius: 15px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.8);
      padding: 25px 18px;
      align-items: center;
      justify-content: center;
    }

    .modal-box {
      width: 100%;
      max-width: 500px;
      background: #151515;
      border: 1px solid #303030;
      border-radius: 18px;
      padding: 22px;
    }

    .modal-box h2 {
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #aaa;
      font-size: 13px;
      margin: 13px 0 6px;
    }

    input {
      width: 100%;
      background: #0b0b0b;
      border: 1px solid #333;
      color: #fff;
      padding: 13px;
      border-radius: 9px;
      outline: none;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .buttons button {
      flex: 1;
      padding: 13px;
      border-radius: 9px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .save {
      background: #fff;
      color: #000;
    }

    .cancel {
      background: #292929;
      color: #fff;
    }
  </style>
</head>

<body>

<header>
  <h1>BAAKO <span>tattoo</span></h1>
  <p>AGENDA</p>
</header>

<main>

  <div class="top">
    <h2>Agendamentos</h2>
    <button class="add" onclick="abrirModal()">+ Novo</button>
  </div>

  <div id="lista">
    <div class="empty">
      Nenhum agendamento ainda.<br><br>
      Toque em <b>+ Novo</b> para adicionar um cliente.
    </div>
  </div>

</main>

<div class="modal" id="modal">

  <div class="modal-box">

    <h2>Novo agendamento</h2>

    <label>Nome do cliente</label>
    <input id="nome" type="text" placeholder="Ex: João">

    <label>Data</label>
    <input id="data" type="date">

    <label>Horário</label>
    <input id="hora" type="time">

    <label>Valor</label>
    <input id="valor" type="number" placeholder="R$ 0,00">

    <div class="buttons">
      <button class="cancel" onclick="fecharModal()">Cancelar</button>
      <button class="save" onclick="salvar()">Salvar</button>
    </div>

  </div>

</div>

<script>

  let agendamentos =
    JSON.parse(localStorage.getItem("baako_agendamentos")) || [];

  function abrirModal() {
    document.getElementById("modal").style.display = "flex";
  }

  function fecharModal() {
    document.getElementById("modal").style.display = "none";
  }

  function salvar() {

    const nome = document.getElementById("nome").value;
    const data = document.getElementById("data").value;
    const hora = document.getElementById("hora").value;
    const valor = document.getElementById("valor").value;

    if (!nome || !data || !hora || !valor) {
      alert("Preencha todos os campos.");
      return;
    }

    agendamentos.push({
      nome,
      data,
      hora,
      valor
    });

    localStorage.setItem(
      "baako_agendamentos",
      JSON.stringify(agendamentos)
    );

    document.getElementById("nome").value = "";
    document.getElementById("data").value = "";
    document.getElementById("hora").value = "";
    document.getElementById("valor").value = "";

    fecharModal();
    mostrarAgendamentos();
  }

  function mostrarAgendamentos() {

    const lista = document.getElementById("lista");

    if (agendamentos.length === 0) {
      lista.innerHTML = `
        <div class="empty">
          Nenhum agendamento ainda.<br><br>
          Toque em <b>+ Novo</b> para adicionar um cliente.
        </div>
      `;
      return;
    }

    lista.innerHTML = "";

    agendamentos
      .sort((a,b) => (a.data + a.hora).localeCompare(b.data + b.hora))
      .forEach((item, index) => {

        lista.innerHTML += `
          <div class="card">
            <div class="date">
              ${formatarData(item.data)} • ${item.hora}
            </div>

            <div class="client">
              ${item.nome}
            </div>

            <div class="details">
              💰 R$ ${Number(item.valor).toFixed(2).replace(".", ",")}
            </div>
          </div>
        `;

      });
  }

  function formatarData(data) {

    const partes = data.split("-");

    return `${partes[2]}/${partes[1]}/${partes[0]}`;
  }

  mostrarAgendamentos();

</script>

</body>
  </html>
